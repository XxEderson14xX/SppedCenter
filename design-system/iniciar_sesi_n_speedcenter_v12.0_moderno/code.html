<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Iniciar Sesión · SpeedCenter</title>
<!-- Inter Font from Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fef2f2',
              100: '#fee2e2',
              500: '#ef4444',
              600: '#dc2626',
              700: '#b91c1c',
              800: '#991b1b',
              900: '#7f1d1d',
            }
          }
        }
      }
    }
  </script>
<!-- Custom Background & Glow Styles -->
<style data-purpose="ambient-lighting">
    .bg-speed-mesh {
      background-color: #0b0708;
      background-image: 
        radial-gradient(at 15% 15%, rgba(185, 28, 28, 0.45) 0px, transparent 55%),
        radial-gradient(at 85% 85%, rgba(153, 27, 27, 0.35) 0px, transparent 60%),
        radial-gradient(at 50% 50%, rgba(220, 38, 38, 0.15) 0px, transparent 75%);
      background-attachment: fixed;
    }
    
    .card-drop-shadow {
      box-shadow: 
        0 20px 45px -10px rgba(0, 0, 0, 0.65),
        0 0 80px -15px rgba(220, 38, 38, 0.22);
    }

    .btn-red-glow {
      box-shadow: 0 10px 24px -4px rgba(220, 38, 38, 0.45), 0 4px 8px -2px rgba(220, 38, 38, 0.25);
    }

    .btn-red-glow:hover {
      box-shadow: 0 14px 28px -4px rgba(220, 38, 38, 0.6), 0 6px 12px -2px rgba(220, 38, 38, 0.35);
    }
  </style>
</head>
<body class="h-full bg-speed-mesh text-slate-800 antialiased font-sans flex items-center justify-center p-4 sm:p-6 overflow-hidden relative selection:bg-brand-500 selection:text-white">
<!-- Ambient Light Orbs -->
<div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-red-600/20 rounded-full blur-[110px] pointer-events-none"></div>
<div class="absolute -bottom-24 right-1/4 w-80 h-80 bg-red-900/30 rounded-full blur-[100px] pointer-events-none"></div>
<!-- BEGIN: MainContent -->
<main class="w-full max-w-[430px] relative z-10" data-purpose="login-container">
<!-- BEGIN: LoginCard -->
<div class="bg-white/95 backdrop-blur-xl rounded-[28px] p-8 sm:p-10 card-drop-shadow border border-white/60 relative overflow-hidden transition-all duration-300">
<!-- Top Subtle Energy Accent Line -->
<div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-600 via-rose-500 to-red-600"></div>
<!-- BEGIN: BrandHeader -->
<header class="text-center mb-8 pt-1" data-purpose="brand-header">
<!-- SpeedCenter Brand Mark -->
<div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-700 via-brand-600 to-rose-500 text-white shadow-md shadow-brand-600/30 mb-4 transform hover:scale-105 transition-transform duration-200">
<svg class="w-6 h-6 transform -rotate-12 translate-x-0.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<!-- Dynamic Lightning / Speed Chevron Icon -->
<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
</svg>
</div>
<h1 class="text-2xl sm:text-[26px] font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-1.5">
<span>SpeedCenter</span>
</h1>
<p class="text-sm font-medium text-slate-500 mt-2">
          Inicia sesión con tu usuario o correo
        </p>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: LoginForm -->
<form action="#" class="space-y-5" data-purpose="login-form" method="POST" onsubmit="event.preventDefault();">
<!-- Field: Usuario o correo -->
<div class="space-y-1.5">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-700 ml-1" for="identifier">
            Usuario o correo
          </label>
<div class="relative rounded-xl group transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-600 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-4 py-3 bg-slate-50/75 hover:bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-xl text-slate-900 text-sm font-medium transition duration-200 focus:outline-none focus:ring-4 focus:ring-brand-500/10 placeholder-slate-400" id="identifier" name="identifier" placeholder="nombre@empresa.com" required="" type="text" value="andis@creativo.com"/>
</div>
</div>
<!-- Field: Contraseña -->
<div class="space-y-1.5">
<div class="flex items-center justify-between ml-1">
<label class="block text-xs font-bold uppercase tracking-wider text-slate-700" for="password">
              Contraseña
            </label>
</div>
<div class="relative rounded-xl group transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-600 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-11 py-3 bg-slate-50/75 hover:bg-slate-50 focus:bg-white border border-slate-200 focus:border-brand-500 rounded-xl text-slate-900 text-sm font-medium tracking-widest transition duration-200 focus:outline-none focus:ring-4 focus:ring-brand-500/10" id="password" name="password" placeholder="••••••••" required="" type="password" value="password123"/>
<!-- Eye Toggle Button -->
<button aria-label="Mostrar u ocultar contraseña" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none" id="togglePassword" type="button">
<!-- Eye Icon -->
<svg class="w-5 h-5" fill="none" id="eyeIcon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full relative group overflow-hidden bg-gradient-to-r from-brand-600 via-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 ease-in-out btn-red-glow flex items-center justify-center gap-2 active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-brand-500/30" type="submit">
<span class="text-base tracking-wide">Ingresar</span>
<svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform duration-200" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: CardFooter -->
<footer class="mt-6 pt-5 border-t border-slate-100 flex flex-col items-center justify-center gap-2" data-purpose="card-footer">
<a class="text-xs font-semibold text-slate-500 hover:text-brand-600 transition-colors" href="#">
          ¿Olvidaste tu contraseña?
        </a>
<div class="flex items-center gap-1.5 text-[11px] text-slate-400">
<svg class="w-3.5 h-3.5 text-emerald-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
<span>Conexión cifrada de alta velocidad</span>
</div>
</footer>
<!-- END: CardFooter -->
</div>
<!-- END: LoginCard -->
<!-- Micro watermark below card -->
<div class="text-center mt-6">
<p class="text-[12px] text-white/30 tracking-wider uppercase font-medium">
        © SpeedCenter Automotive System
      </p>
</div>
</main>
<!-- END: MainContent -->
<!-- Password toggle interactivity -->
<script data-purpose="password-visibility-toggle">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          // Switch icon between open and slashed eye
          if (isPassword) {
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            `;
          } else {
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
          }
        });
      }
    });
  </script>
</body></html>
