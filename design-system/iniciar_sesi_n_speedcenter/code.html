<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SpeedCenter - Iniciar Sesión</title>
<!-- Tailwind CSS CDN with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<!-- BEGIN: Custom Styling -->
<style data-purpose="background-gradient">
    /* Precise background reproduction matching the dark maroon to rich crimson transition */
    .bg-speedcenter-gradient {
      background: radial-gradient(ellipse 110% 100% at 75% 50%, #9c1b24 0%, #761217 38%, #390a0f 72%, #1a080a 100%);
      background-attachment: fixed;
    }
  </style>
<style data-purpose="input-custom-styles">
    /* Subtle custom pastel blue input fill matching reference image */
    .bg-input-blue {
      background-color: #eaf1fb;
    }
    .bg-input-blue:focus {
      background-color: #f1f6fd;
      border-color: #cbdcf7;
    }
  </style>
<!-- END: Custom Styling -->
</head>
<body class="h-full w-full bg-speedcenter-gradient flex items-center justify-center font-sans antialiased select-none p-4">
<!-- BEGIN: Main Login Container -->
<main class="w-full flex items-center justify-center">
<!-- BEGIN: Login Card -->
<div class="bg-white w-full max-w-[420px] rounded-[24px] shadow-2xl px-10 py-12 transition-all" data-purpose="login-card">
<!-- BEGIN: Header Section -->
<header class="text-center mb-7">
<h1 class="text-[28px] font-bold text-gray-900 tracking-tight leading-tight">
          SpeedCenter
        </h1>
<p class="text-[13.5px] text-slate-500 font-normal mt-2.5">
          Inicia sesión con tu usuario o correo
        </p>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Login Form -->
<form class="space-y-4" data-purpose="login-form" onsubmit="event.preventDefault();">
<!-- Username / Email Field -->
<div>
<label class="block text-[13px] font-medium text-gray-800 mb-1.5 ml-0.5" for="username">
            Usuario o correo
          </label>
<input autocomplete="username" class="w-full bg-input-blue border border-transparent rounded-[10px] px-3.5 py-2.5 text-[14px] text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors" id="username" name="username" type="text" value="andis@creativo.com"/>
</div>
<!-- Password Field -->
<div class="pt-1">
<label class="block text-[13px] font-medium text-gray-800 mb-1.5 ml-0.5" for="password">
            Contraseña
          </label>
<input autocomplete="current-password" class="w-full bg-input-blue border border-transparent rounded-[10px] px-3.5 py-2.5 text-[14px] text-gray-900 placeholder-gray-400 tracking-wider focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors" id="password" name="password" type="password" value="•••••••"/>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-[#cb292c] hover:bg-[#b82326] active:bg-[#a61c1f] text-white font-medium py-3 rounded-[10px] text-[15px] shadow-sm transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-600" data-purpose="submit-button" type="submit">
            Ingresar
          </button>
</div>
</form>
<!-- END: Login Form -->
</div>
<!-- END: Login Card -->
</main>
<!-- END: Main Login Container -->
</body></html>
