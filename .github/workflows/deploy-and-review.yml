name: Gemini AI Auto-Update & Deploy

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gemini Auto Code Generator & Injector
        uses: google-github-actions/run-gemini-cli@v1
        continue-on-error: true
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Lee la descripción del Issue actual en GitHub y aplica directamente las modificaciones de código requeridas en index.html, assets/styles.css y assets/app.js respetando la arquitectura actual de SPEEDCENTER."

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(auto): Actualización automática Gemini para Issue #${{ github.event.issue.number }}"
          branch: main
