name: Gemini AI Auto-Update & Deploy

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reparar diseño limpio y estructurado v11.9.5
        run: |
          cat << 'EOF' > update_script.js
          const fs = require("fs");

          // 1. Leer index.html y actualizar versión
          let html = fs.readFileSync("index.html", "utf8");
          html = html.replace(/\?v=11\.\d+(\.\d+)?/g, "?v=11.9.5");
          html = html.replace(/mínimo 6 caracteres/gi, "Ej. Speed2026");
          fs.writeFileSync("index.html", html);

          // 2. CSS ordenado y limpio para los requisitos
          let css = fs.readFileSync("assets/styles.css", "utf8");
          if (!css.includes("v11.9.5")) {
            css += '\n\n/* v11.9.5 - Estilos limpios para validación de contraseña */\n.requisitos-password {\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n  font-size: 11.5px;\n  background: #f8fafc;\n  padding: 10px 12px;\n  border-radius: 6px;\n  border: 1px solid var(--border);\n  margin-top: 8px;\n  width: 100%;\n  box-sizing: border-box;\n}\n.req-item {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  color: #64748b;\n  transition: all 0.15s ease;\n}\n.req-item.valido {\n  color: #16a34a;\n  font-weight: 600;\n}\n.req-item.invalido {\n  color: #dc2626;\n}\n';
            fs.writeFileSync("assets/styles.css", css);
          }

          console.log("Script ejecutado correctamente.");
          EOF
          node update_script.js
          rm update_script.js

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(ui): Corrección definitiva de diseño y estilos de contraseña v11.9.5"
          branch: main
