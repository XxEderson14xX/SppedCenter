name: Gemini AI Auto-Update & Deploy

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unificar estetica de contraseñas en ambos modales v11.9.13
        run: |
          node << 'NODESCRIPT'
          const fs = require("fs");

          // 1. Actualizar index.html y asegurar clases idénticas para ambos modales
          let html = fs.readFileSync("index.html", "utf8");
          html = html.replace(/\?v=11\.\d+(\.\d+)?/g, "?v=11.9.13");

          // Limpiamos y normalizamos las estructuras de requisitos en ambos formularios
          html = html.replace(/<div id="password-req-crear"[\s\S]*?<\/div>/g, "");
          html = html.replace(/<div id="password-req-editar"[\s\S]*?<\/div>/g, "");

          // Insertar en Creación de Usuario
          if (html.includes('id="nuevo-password"')) {
            const idx = html.indexOf('id="nuevo-password"');
            const endDiv = html.indexOf('</div>', idx);
            if (endDiv !== -1) {
              const pos = endDiv + 6;
              const boxCrear = '\n            <div id="password-req-crear" class="requisitos-password" style="display:none;">\n              <span id="req-crear-len" class="req-item invalido">&#x2717; Mínimo 8 caracteres</span>\n              <span id="req-crear-min" class="req-item invalido">&#x2717; Una letra minúscula (a-z)</span>\n              <span id="req-crear-may" class="req-item invalido">&#x2717; Una letra mayúscula (A-Z)</span>\n              <span id="req-crear-num" class="req-item invalido">&#x2717; Un número (0-9)</span>\n            </div>';
              html = html.slice(0, pos) + boxCrear + html.slice(pos);
            }
          }

          // Insertar en Edición de Usuario
          if (html.includes('id="usuario-password"')) {
            const idx2 = html.indexOf('id="usuario-password"');
            const endDiv2 = html.indexOf('</div>', idx2);
            if (endDiv2 !== -1) {
              const pos2 = endDiv2 + 6;
              const boxEditar = '\n            <div id="password-req-editar" class="requisitos-password" style="display:none;">\n              <span id="req-edit-len" class="req-item invalido">&#x2717; Mínimo 8 caracteres</span>\n              <span id="req-edit-min" class="req-item invalido">&#x2717; Una letra minúscula (a-z)</span>\n              <span id="req-edit-may" class="req-item invalido">&#x2717; Una letra mayúscula (A-Z)</span>\n              <span id="req-edit-num" class="req-item invalido">&#x2717; Un número (0-9)</span>\n            </div>';
              html = html.slice(0, pos2) + boxEditar + html.slice(pos2);
            }
          }

          fs.writeFileSync("index.html", html);

          // 2. Unificar y pulir CSS global para ambos modales
          let css = fs.readFileSync("assets/styles.css", "utf8");
          if (!css.includes("v11.9.13")) {
            css += `

/* v11.9.13 - Estetica unificada para modales de creacion y edicion de usuarios */
#nuevo-password, #usuario-password {
  display: flex;
  flex-direction: column;
  width: 100%;
  grid-column: 1 / -1; /* Ocupa todo el ancho disponible en la rejilla del modal */
}

.requisitos-password {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11.5px;
  background: #f8fafc;
  padding: 10px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  margin-top: 8px;
  width: 100%;
  box-sizing: border-box;
  clear: both;
}

.req-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #64748b;
  transition: all 0.15s ease;
}

.req-item.valido {
  color: #16a34a;
  font-weight: 600;
}

.req-item.invalido {
  color: #dc2626;
}
`;
            fs.writeFileSync("assets/styles.css", css);
          }

          console.log("Actualización v11.9.13 aplicada con éxito.");
          NODESCRIPT

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(ui): Unifica estetica de requisitos de contraseña en creacion y edicion v11.9.13"
          branch: main
