name: Gemini AI Auto-Update & Deploy

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Corregir UI de validación en modal de edición v11.9.2
        run: |
          cat << 'EOF' > update_script.js
          const fs = require("fs");

          // 1. Modificar index.html subiendo versión
          let html = fs.readFileSync("index.html", "utf8");
          html = html.replace(/\?v=11\.\d+(\.\d+)?/g, "?v=11.9.2");

          // Inyección precisa fuera de la fila flex en el modal de edición
          if (!html.includes('id="password-req-editar"')) {
            html = html.replace(
              /id="usuario-password"[^>]*>[\s\S]*?<\/div>/i,
              (match) => {
                return match + '\n            <div id="password-req-editar" class="requisitos-password" style="display:none; margin-top:8px;">\n              <span id="req-edit-len" class="req-item invalido">✗ Mínimo 8 caracteres</span>\n              <span id="req-edit-min" class="req-item invalido">✗ Una letra minúscula (a-z)</span>\n              <span id="req-edit-may" class="req-item invalido">✗ Una letra mayúscula (A-Z)</span>\n              <span id="req-edit-num" class="req-item invalido">✗ Un número (0-9)</span>\n            </div>';
              }
            );
            fs.writeFileSync("index.html", html);
          }

          // 2. Modificar assets/app.js para asegurar el evento input en la edición
          let js = fs.readFileSync("assets/app.js", "utf8");
          
          if (!js.includes("evaluarPassword")) {
            js += '\n\n// === V11.9.2: Validación dinámica de contraseña ===\nfunction evaluarPassword(valor, ids) {\n  const tieneLen = valor.length >= 8;\n  const tieneMin = /[a-z]/.test(valor);\n  const tieneMay = /[A-Z]/.test(valor);\n  const tieneNum = /[0-9]/.test(valor);\n  const setReq = (id, valido, texto) => {\n    const elReq = document.getElementById(id);\n    if (!elReq) return;\n    elReq.className = valido ? "req-item valido" : "req-item invalido";\n    elReq.textContent = (valido ? "✓ " : "✗ ") + texto;\n  };\n  setReq(ids.len, tieneLen, "Mínimo 8 caracteres");\n  setReq(ids.min, tieneMin, "Una letra minúscula (a-z)");\n  setReq(ids.may, tieneMay, "Una letra mayúscula (A-Z)");\n  setReq(ids.num, tieneNum, "Un número (0-9)");\n  return tieneLen && tieneMin && tieneMay && tieneNum;\n}\n\ndocument.addEventListener("DOMContentLoaded", () => {\n  const attachPassEvents = () => {\n    const passEdit = document.getElementById("usuario-password");\n    const passReqEdit = document.getElementById("password-req-editar");\n    if (passEdit && passReqEdit) {\n      passEdit.addEventListener("input", () => {\n        const val = passEdit.value;\n        if (!val) { passReqEdit.style.display = "none"; return; }\n        passReqEdit.style.display = "flex";\n        evaluarPassword(val, { len: "req-edit-len", min: "req-edit-min", may: "req-edit-may", num: "req-edit-num" });\n      });\n    }\n\n    const passNuevo = document.getElementById("nuevo-password");\n    const passReqCrear = document.getElementById("password-req-crear");\n    if (passNuevo && passReqCrear) {\n      passNuevo.addEventListener("input", () => {\n        evaluarPassword(passNuevo.value, { len: "req-crear-len", min: "req-crear-min", may: "req-crear-may", num: "req-crear-num" });\n      });\n    }\n  };\n  attachPassEvents();\n});\n';
            fs.writeFileSync("assets/app.js", js);
          }

          console.log("Corrección para modal de edición v11.9.2 completada.");
          EOF
          node update_script.js
          rm update_script.js

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(ui): Corrige contenedor de validación en modal de editar usuario v11.9.2"
          branch: main
